; Overrides only. Loaded into the Debian pool.d, which already defines the www
; pool; redeclaring listen/user/group here would move FPM off the socket nginx
; uses and take the stack down.
[www]
php_admin_value[memory_limit] = 512M
php_admin_value[openssl.cafile] = "/etc/ssl/certs/ca-certificates.crt"
php_admin_value[curl.cainfo] = "/etc/ssl/certs/ca-certificates.crt"
pm = dynamic
pm.max_children = 20
pm.start_servers = 5
pm.min_spare_servers = 5
pm.max_spare_servers = 10
pm.max_requests = 500
